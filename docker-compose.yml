services:
  mongo:
    image: mongo:7
    restart: always
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().members[0].stateStr === 'PRIMARY' ? quit(0) : quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    ports:
      - "3001:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB}?replicaSet=rs0
      CORS_ORIGIN: http://localhost:5173
      API_PREFIX: api
      SWAGGER_ENABLED: "true"
      JWT_SECRET: dev-padlet-secret
      JWT_EXPIRES_IN: 7d
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: padlet-images
      S3_REGION: us-east-1
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: sh -c "npm install && npx prisma db push --accept-data-loss && npm run start:dev"

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - ./client:/app
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      server:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  mongo_data:
  minio_data:

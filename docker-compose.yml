services:
  mongo:
    image: mongo:7
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().members[0].stateStr === 'PRIMARY' ? quit(0) : quit(1) } catch (e) { rs.initiate(); quit(1) }\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    ports:
      - "3001:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB}?replicaSet=rs0
      CORS_ORIGIN: http://localhost:5173
      API_PREFIX: api
      SWAGGER_ENABLED: "true"
      JWT_SECRET: dev-padlet-secret
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: sh -c "npm install && npx prisma db push --accept-data-loss && npm run start:dev"

  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
      - ./client:/app
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      server:
        condition: service_healthy
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  mongo_data:

name: Automated Tests

on:
  push:
    branches:
      - main
      - dev
      - feature/**

  pull_request:
    branches:
      - main
      - dev

jobs:
  server-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present